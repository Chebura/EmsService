name: Windows installer

# Builds and tests the service, then builds the MSI installer.
# On push to main the MSI is published to the GitHub release `v<Version>` (Version from EmsService.csproj),
# so README can link to releases/latest/download/EmsService.msi.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --solution EmsService.sln -c Release

      - name: Build MSI
        run: dotnet build Installer -c Release

      - uses: actions/upload-artifact@v5
        with:
          name: EmsService-msi
          path: Installer/bin/Release/EmsService.msi
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content EmsService/EmsService.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          $msi = "Installer/bin/Release/EmsService.msi"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Same version rebuilt: replace the installer in the existing release.
            gh release upload $tag $msi --clobber
          } else {
            gh release create $tag $msi --target $env:GITHUB_SHA --title "EMS Service $version" --notes "Установщик EMS Service $version для Windows (x64). История изменений — EmsService/release-notes.txt."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
